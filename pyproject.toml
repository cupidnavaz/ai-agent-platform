[project]
name = "ai-agent-platform"
version = "0.2.0-alpha.1"
description = "Production-ready modular AI Agent Platform"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
